[package]
name = "textassistance-desktop"
description = "TextAssistance menu-bar app: checks the text you are typing in any app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "textassistance"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
arboard = "3"
enigo = "0.6"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time"] }
writer-engine.workspace = true
writer-llm.workspace = true
writer-protocol.workspace = true
writer-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
